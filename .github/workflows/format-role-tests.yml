name: Format role-targeted SQL tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/run-sql-role-targeting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/run-sql-role-targeting
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format bounded test file
        run: |
          pnpm exec prettier --write mcp/__tests__/run-sql-role-selection.integration.test.ts
          rm .github/workflows/format-role-tests.yml
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/format-role-tests.yml' 'mcp/__tests__/run-sql-role-selection.integration.test.ts' | sort)"
          test "$actual" = "$expected"
      - name: Commit formatting and remove helper
        run: |
          git config user.name 'buffr-cto-cio'
          git config user.email 'actions@users.noreply.github.com'
          git add mcp/__tests__/run-sql-role-selection.integration.test.ts .github/workflows/format-role-tests.yml
          git commit -m 'test: format role-targeted SQL hardening'
          git push origin HEAD:feat/run-sql-role-targeting
