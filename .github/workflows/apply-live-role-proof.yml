name: Apply live role-targeting proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-prove:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/run-sql-role-targeting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/run-sql-role-targeting
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply bounded live proof
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mcp/__tests__/live/mcp-server.live.e2e.test.ts')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "const LOCK_HOLD_SECONDS = 15;\n",
              """const LOCK_HOLD_SECONDS = 15;\nconst ROLE_TARGET_SCHEMA = 'role_targeting';\nconst ROLE_TARGET_ROLE = 'mcp_role_target_writer';\nconst ROLE_TARGET_ALLOWED = 'allowed_rows';\nconst ROLE_TARGET_FORBIDDEN = 'forbidden_rows';\n""",
          )
          replace_once(
              "  let projectId: string | undefined;\n",
              "  let projectId: string | undefined;\n  let defaultBranchId = '';\n",
          )
          replace_once(
              """      const response = await neonClient.getProject(projectId);\n      expect(response.data.project.name).toBe(projectName);\n""",
              """      const response = await neonClient.getProject(projectId);\n      expect(response.data.project.name).toBe(projectName);\n\n      const branchList = z\n        .object({\n          branches: z.array(z.object({ id: z.string(), name: z.string() })),\n        })\n        .parse(\n          JSON.parse(\n            assertToolSucceeded(\n              'list_branches',\n              await callTool('list_branches', { project_id: projectId }),\n            ),\n          ),\n        );\n      const mainBranch = branchList.branches.find(\n        (branch) => branch.name === 'main',\n      );\n      if (!mainBranch) {\n        throw new Error('Default main branch was not returned.');\n      }\n      defaultBranchId = mainBranch.id;\n      expect(defaultBranchId).toMatch(/^br-/);\n""",
          )

          marker = """\n  it(\n    'creates same-named public and CRM tables in the real database',\n"""
          if text.count(marker) != 1:
              raise SystemExit('expected one insertion marker for live role proof')

          proof = r'''\n  it(\n    'proves role-targeted authentication, least privilege, revocation, restoration, and rollback',\n    async () => {\n      if (!projectId) throw new Error('Test project was not created.');\n      if (!defaultBranchId) throw new Error('Default branch was not resolved.');\n\n      assertToolSucceeded(\n        'create_postgres_role',\n        await callTool('create_postgres_role', {\n          project_id: projectId,\n          branch_id: defaultBranchId,\n          name: ROLE_TARGET_ROLE,\n          no_login: false,\n        }),\n      );\n\n      assertToolSucceeded(\n        'run_sql_transaction/setup-role-targeting',\n        await callTool('run_sql_transaction', {\n          project_id: projectId,\n          branch_id: defaultBranchId,\n          sql_statements: [\n            `CREATE SCHEMA ${ROLE_TARGET_SCHEMA}`,\n            `REVOKE ALL ON SCHEMA ${ROLE_TARGET_SCHEMA} FROM PUBLIC`,\n            `CREATE TABLE ${ROLE_TARGET_SCHEMA}.${ROLE_TARGET_ALLOWED} (id int PRIMARY KEY)`,\n            `CREATE TABLE ${ROLE_TARGET_SCHEMA}.${ROLE_TARGET_FORBIDDEN} (id int PRIMARY KEY)`,\n            `GRANT USAGE ON SCHEMA ${ROLE_TARGET_SCHEMA} TO ${ROLE_TARGET_ROLE}`,\n            `GRANT SELECT, INSERT ON ${ROLE_TARGET_SCHEMA}.${ROLE_TARGET_ALLOWED} TO ${ROLE_TARGET_ROLE}`,\n          ],\n        }),\n      );\n\n      const identity = await callTool('run_sql', {\n        project_id: projectId,\n        branch_id: defaultBranchId,\n        role_name: ROLE_TARGET_ROLE,\n        sql: 'SELECT session_user, current_user',\n      });\n      const identityRows = z\n        .array(\n          z.object({ session_user: z.string(), current_user: z.string() }),\n        )\n        .parse(\n          JSON.parse(assertToolSucceeded('run_sql/role-identity', identity)),\n        );\n      expect(identityRows).toEqual([\n        { session_user: ROLE_TARGET_ROLE, current_user: ROLE_TARGET_ROLE },\n      ]);\n\n      assertToolSucceeded(\n        'run_sql/role-allowed-insert',\n        await callTool('run_sql', {\n          project_id: projectId,\n          branch_id: defaultBranchId,\n          role_name: ROLE_TARGET_ROLE,\n          sql: `INSERT INTO ${ROLE_TARGET_SCHEMA}.${ROLE_TARGET_ALLOWED} (id) VALUES (1)`,\n        }),\n      );\n\n      const denied = await callTool('run_sql', {\n        project_id: projectId,\n        branch_id: defaultBranchId,\n        role_name: ROLE_TARGET_ROLE,\n        sql: `SELECT * FROM ${ROLE_TARGET_SCHEMA}.${ROLE_TARGET_FORBIDDEN}`,\n      });\n      expect(toolResultSchema.parse(denied).isError).toBe(true);\n      expect(textContent(denied)).toMatch(/permission denied/i);\n\n      assertToolSucceeded(\n        'run_sql/disable-role-login',\n        await callTool('run_sql', {\n          project_id: projectId,\n          branch_id: defaultBranchId,\n          sql: `ALTER ROLE ${ROLE_TARGET_ROLE} NOLOGIN`,\n        }),\n      );\n\n      const revoked = await callTool('run_sql', {\n        project_id: projectId,\n        branch_id: defaultBranchId,\n        role_name: ROLE_TARGET_ROLE,\n        sql: `INSERT INTO ${ROLE_TARGET_SCHEMA}.${ROLE_TARGET_ALLOWED} (id) VALUES (99)`,\n      });\n      expect(toolResultSchema.parse(revoked).isError).toBe(true);\n\n      const afterRevocation = z\n        .array(z.object({ count: z.string() }))\n        .parse(\n          JSON.parse(\n            assertToolSucceeded(\n              'run_sql/verify-revocation-no-write',\n              await callTool('run_sql', {\n                project_id: projectId,\n                branch_id: defaultBranchId,\n                sql: `SELECT count(*)::text AS count FROM ${ROLE_TARGET_SCHEMA}.${ROLE_TARGET_ALLOWED} WHERE id = 99`,\n              }),\n            ),\n          ),\n        );\n      expect(afterRevocation[0]?.count).toBe('0');\n\n      assertToolSucceeded(\n        'run_sql/restore-role-login',\n        await callTool('run_sql', {\n          project_id: projectId,\n          branch_id: defaultBranchId,\n          sql: `ALTER ROLE ${ROLE_TARGET_ROLE} LOGIN`,\n        }),\n      );\n\n      const restored = await callTool('run_sql', {\n        project_id: projectId,\n        branch_id: defaultBranchId,\n        role_name: ROLE_TARGET_ROLE,\n        sql: 'SELECT session_user, current_user',\n      });\n      expect(\n        z\n          .array(\n            z.object({ session_user: z.string(), current_user: z.string() }),\n          )\n          .parse(\n            JSON.parse(\n              assertToolSucceeded('run_sql/role-restored', restored),\n            ),\n          ),\n      ).toEqual([\n        { session_user: ROLE_TARGET_ROLE, current_user: ROLE_TARGET_ROLE },\n      ]);\n\n      const txIdentity = await callTool('run_sql_transaction', {\n        project_id: projectId,\n        branch_id: defaultBranchId,\n        role_name: ROLE_TARGET_ROLE,\n        sql_statements: [\n          'SELECT session_user, current_user',\n          `INSERT INTO ${ROLE_TARGET_SCHEMA}.${ROLE_TARGET_ALLOWED} (id) VALUES (2)`,\n        ],\n      });\n      const txResults = z.array(z.unknown()).parse(\n        JSON.parse(\n          assertToolSucceeded(\n            'run_sql_transaction/role-identity',\n            txIdentity,\n          ),\n        ),\n      );\n      expect(JSON.stringify(txResults)).toContain(ROLE_TARGET_ROLE);\n\n      const rollback = await callTool('run_sql_transaction', {\n        project_id: projectId,\n        branch_id: defaultBranchId,\n        role_name: ROLE_TARGET_ROLE,\n        sql_statements: [\n          `INSERT INTO ${ROLE_TARGET_SCHEMA}.${ROLE_TARGET_ALLOWED} (id) VALUES (77)`,\n          'SELECT 1 / 0',\n        ],\n      });\n      expect(toolResultSchema.parse(rollback).isError).toBe(true);\n\n      const afterRollback = z\n        .array(z.object({ count: z.string() }))\n        .parse(\n          JSON.parse(\n            assertToolSucceeded(\n              'run_sql/verify-rollback-no-write',\n              await callTool('run_sql', {\n                project_id: projectId,\n                branch_id: defaultBranchId,\n                sql: `SELECT count(*)::text AS count FROM ${ROLE_TARGET_SCHEMA}.${ROLE_TARGET_ALLOWED} WHERE id = 77`,\n              }),\n            ),\n          ),\n        );\n      expect(afterRollback[0]?.count).toBe('0');\n    },\n    LIVE_TEST_TIMEOUT_MS,\n  );\n'''
          text = text.replace(marker, proof + marker, 1)
          path.write_text(text)
          PY

          pnpm exec prettier --write mcp/__tests__/live/mcp-server.live.e2e.test.ts
      - name: Run live role proof
        env:
          NEON_API_KEY: ${{ secrets.NEON_TEST_API_KEY }}
        run: pnpm test:e2e:live
      - name: Commit proof and remove helper
        run: |
          rm .github/workflows/apply-live-role-proof.yml
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/apply-live-role-proof.yml' 'mcp/__tests__/live/mcp-server.live.e2e.test.ts' | sort)"
          test "$actual" = "$expected"
          git config user.name 'buffr-cto-cio'
          git config user.email 'actions@users.noreply.github.com'
          git add mcp/__tests__/live/mcp-server.live.e2e.test.ts .github/workflows/apply-live-role-proof.yml
          git commit -m 'test: prove role-targeted PostgreSQL authentication'
          git push origin HEAD:feat/run-sql-role-targeting
