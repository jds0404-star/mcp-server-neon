name: Apply role propagation patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/run-sql-role-targeting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/run-sql-role-targeting

      - name: Apply bounded propagation patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mcp/tools/tools.ts')
          text = path.read_text()

          replacements = [
              (
                  """    projectId,\n    branchId,\n  }: {\n    sql: string;\n    databaseName?: string;\n    projectId: string;\n    branchId?: string;\n  },""",
                  """    projectId,\n    branchId,\n    roleName,\n    computeId,\n  }: {\n    sql: string;\n    databaseName?: string;\n    projectId: string;\n    branchId?: string;\n    roleName?: string;\n    computeId?: string;\n  },""",
              ),
              (
                  """        projectId,\n        branchId,\n        databaseName,\n      },""",
                  """        projectId,\n        branchId,\n        databaseName,\n        roleName,\n        computeId,\n      },""",
              ),
              (
                  """    projectId,\n    branchId,\n  }: {\n    sqlStatements: string[];\n    databaseName?: string;\n    projectId: string;\n    branchId?: string;\n  },""",
                  """    projectId,\n    branchId,\n    roleName,\n    computeId,\n  }: {\n    sqlStatements: string[];\n    databaseName?: string;\n    projectId: string;\n    branchId?: string;\n    roleName?: string;\n    computeId?: string;\n  },""",
              ),
              (
                  """      projectId,\n      branchId,\n      databaseName,\n    },""",
                  """      projectId,\n      branchId,\n      databaseName,\n      roleName,\n      computeId,\n    },""",
              ),
              (
                  """        projectId: params.project_id,\n        branchId: params.branch_id,\n      },\n      neonClient,\n      extra,\n    );""",
                  """        projectId: params.project_id,\n        branchId: params.branch_id,\n        roleName: params.role_name,\n        computeId: params.compute_id,\n      },\n      neonClient,\n      extra,\n    );""",
              ),
              (
                  """          projectId: params.project_id,\n          branchId: params.branch_id,\n        },\n        neonClient,\n        extra,\n      );""",
                  """          projectId: params.project_id,\n          branchId: params.branch_id,\n          roleName: params.role_name,\n          computeId: params.compute_id,\n        },\n        neonClient,\n        extra,\n      );""",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          rm .github/workflows/apply-role-propagation.yml

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/apply-role-propagation.yml' 'mcp/tools/tools.ts' | sort)"
          test "$actual" = "$expected"

      - name: Commit bounded patch and remove helper
        run: |
          git config user.name 'buffr-cto-cio'
          git config user.email 'actions@users.noreply.github.com'
          git add mcp/tools/tools.ts .github/workflows/apply-role-propagation.yml
          git commit -m 'feat: propagate SQL role selection'
          git push origin HEAD:feat/run-sql-role-targeting
