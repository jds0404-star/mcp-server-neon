name: Apply role propagation patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/run-sql-role-targeting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/run-sql-role-targeting

      - name: Apply bounded propagation patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mcp/tools/tools.ts')
          text = path.read_text()

          def replace_once_in_section(text, start_marker, end_marker, old, new):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              section = text[start:end]
              count = section.count(old)
              if count != 1:
                  raise SystemExit(
                      f'expected one match between {start_marker!r} and {end_marker!r}, found {count}'
                  )
              section = section.replace(old, new, 1)
              return text[:start] + section + text[end:]

          text = replace_once_in_section(
              text,
              'async function handleRunSql(',
              'async function handleRunSqlTransaction(',
              """    branchId,\n  }: {\n    sql: string;\n    databaseName?: string;\n    projectId: string;\n    branchId?: string;\n  },""",
              """    branchId,\n    roleName,\n    computeId,\n  }: {\n    sql: string;\n    databaseName?: string;\n    projectId: string;\n    branchId?: string;\n    roleName?: string;\n    computeId?: string;\n  },""",
          )
          text = replace_once_in_section(
              text,
              'async function handleRunSql(',
              'async function handleRunSqlTransaction(',
              """        projectId,\n        branchId,\n        databaseName,\n      },""",
              """        projectId,\n        branchId,\n        databaseName,\n        roleName,\n        computeId,\n      },""",
          )

          text = replace_once_in_section(
              text,
              'async function handleRunSqlTransaction(',
              'async function handleGetDatabaseTables(',
              """    branchId,\n  }: {\n    sqlStatements: string[];\n    databaseName?: string;\n    projectId: string;\n    branchId?: string;\n  },""",
              """    branchId,\n    roleName,\n    computeId,\n  }: {\n    sqlStatements: string[];\n    databaseName?: string;\n    projectId: string;\n    branchId?: string;\n    roleName?: string;\n    computeId?: string;\n  },""",
          )
          text = replace_once_in_section(
              text,
              'async function handleRunSqlTransaction(',
              'async function handleGetDatabaseTables(',
              """      projectId,\n      branchId,\n      databaseName,\n    },""",
              """      projectId,\n      branchId,\n      databaseName,\n      roleName,\n      computeId,\n    },""",
          )

          text = replace_once_in_section(
              text,
              '  run_sql: host(',
              '  run_sql_transaction: host(',
              """        projectId: params.project_id,\n        branchId: params.branch_id,\n      },""",
              """        projectId: params.project_id,\n        branchId: params.branch_id,\n        roleName: params.role_name,\n        computeId: params.compute_id,\n      },""",
          )
          text = replace_once_in_section(
              text,
              '  run_sql_transaction: host(',
              '  describe_table_schema: host(',
              """          projectId: params.project_id,\n          branchId: params.branch_id,\n        },""",
              """          projectId: params.project_id,\n          branchId: params.branch_id,\n          roleName: params.role_name,\n          computeId: params.compute_id,\n        },""",
          )

          path.write_text(text)
          PY

          rm .github/workflows/apply-role-propagation.yml

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/apply-role-propagation.yml' 'mcp/tools/tools.ts' | sort)"
          test "$actual" = "$expected"

      - name: Commit bounded patch and remove helper
        run: |
          git config user.name 'buffr-cto-cio'
          git config user.email 'actions@users.noreply.github.com'
          git add mcp/tools/tools.ts .github/workflows/apply-role-propagation.yml
          git commit -m 'feat: propagate SQL role selection'
          git push origin HEAD:feat/run-sql-role-targeting
