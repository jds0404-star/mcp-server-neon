name: Run corrected live role-targeting proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  live-role-proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/run-sql-role-targeting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/run-sql-role-targeting
          fetch-depth: 0
      - name: Check whether live proof is already present
        id: gate
        run: |
          if grep -Fq "proves role-targeted authentication, least privilege, revocation, restoration, and rollback" mcp/__tests__/live/mcp-server.live.e2e.test.ts; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node
        if: steps.gate.outputs.needed == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Setup pnpm
        if: steps.gate.outputs.needed == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json
      - name: Install dependencies
        if: steps.gate.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Apply corrected bounded live proof
        if: steps.gate.outputs.needed == 'true'
        run: |
          python - <<'PY'
          import subprocess
          import textwrap

          source = subprocess.check_output(
              [
                  'git',
                  'show',
                  "98f53072939380655a93878a12cb251d6f89b04a:.github/workflows/apply-live-role-proof.yml",
              ],
              text=True,
          )
          begin = "          python - <<'PY'\n"
          end = "\n          PY\n"
          start = source.index(begin) + len(begin)
          stop = source.index(end, start)
          patch_script = textwrap.dedent(source[start:stop])
          old = "proof = r'''"
          new = "proof = '''"
          if patch_script.count(old) != 1:
              raise SystemExit(
                  f'expected exactly one raw proof marker, found {patch_script.count(old)}'
              )
          patch_script = patch_script.replace(old, new, 1)
          exec(compile(patch_script, 'corrected-live-role-proof.py', 'exec'), {})
          PY
          pnpm exec prettier --write mcp/__tests__/live/mcp-server.live.e2e.test.ts
          test "$(git diff --name-only)" = "mcp/__tests__/live/mcp-server.live.e2e.test.ts"
      - name: Run live role proof
        if: steps.gate.outputs.needed == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_TEST_API_KEY }}
        run: pnpm test:e2e:live
      - name: Commit live proof test
        if: steps.gate.outputs.needed == 'true'
        run: |
          test "$(git diff --name-only)" = "mcp/__tests__/live/mcp-server.live.e2e.test.ts"
          git config user.name 'buffr-cto-cio'
          git config user.email 'actions@users.noreply.github.com'
          git add mcp/__tests__/live/mcp-server.live.e2e.test.ts
          git commit -m 'test: prove role-targeted PostgreSQL authentication'
          git push origin HEAD:feat/run-sql-role-targeting
