name: Disposable Vault Neon credential spike

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  vault-neon-poc:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/run-sql-role-targeting'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_API_KEY: ${{ secrets.NEON_TEST_API_KEY }}
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: poc-root-token
      VAULT_IMAGE: hashicorp/vault:1.21.4
    steps:
      - name: Verify bounded inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NEON_API_KEY:-}" || { echo 'NEON_TEST_API_KEY is unavailable'; exit 1; }
          command -v curl >/dev/null
          command -v jq >/dev/null
          command -v docker >/dev/null
          echo 'BOUNDARY=personal fork + disposable Neon project only'

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Start disposable Vault Community dev server
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$VAULT_IMAGE" >/dev/null
          docker run -d --rm \
            --name vault-neon-poc \
            --cap-add=IPC_LOCK \
            -p 8200:8200 \
            "$VAULT_IMAGE" \
            server -dev \
            -dev-root-token-id="$VAULT_TOKEN" \
            -dev-listen-address=0.0.0.0:8200 >/dev/null
          for attempt in $(seq 1 30); do
            if curl -fsS "$VAULT_ADDR/v1/sys/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs vault-neon-poc
          exit 1

      - name: Run live disposable credential proof
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          WORKDIR="$(mktemp -d)"
          PROJECT_ID=''
          PROJECT_NAME="smoke-mcp-live-vault-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          LEASE_ID=''

          cleanup() {
            rc=$?
            trap - EXIT
            set +e
            if [[ -n "${LEASE_ID:-}" ]]; then
              python - "$LEASE_ID" > "$WORKDIR/revoke-cleanup.json" <<'PY'
          import json, sys
          json.dump({"lease_id": sys.argv[1]}, sys.stdout)
          PY
              curl -fsS \
                -H "X-Vault-Token: $VAULT_TOKEN" \
                -H 'Content-Type: application/json' \
                --request PUT \
                --data-binary "@$WORKDIR/revoke-cleanup.json" \
                "$VAULT_ADDR/v1/sys/leases/revoke" >/dev/null 2>&1 || true
            fi
            if [[ -n "${PROJECT_ID:-}" && "$PROJECT_NAME" == smoke-mcp-live-vault-* ]]; then
              curl -fsS \
                -H "Authorization: Bearer $NEON_API_KEY" \
                --request DELETE \
                "https://console.neon.tech/api/v2/projects/$PROJECT_ID" >/dev/null 2>&1 || true
            fi
            docker rm -f vault-neon-poc >/dev/null 2>&1 || true
            rm -rf "$WORKDIR"
            exit "$rc"
          }
          trap cleanup EXIT

          cat > "$WORKDIR/create-project.json" <<JSON
          {"project":{"name":"$PROJECT_NAME"}}
          JSON

          curl -fsS \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H 'Content-Type: application/json' \
            --request POST \
            --data-binary "@$WORKDIR/create-project.json" \
            'https://console.neon.tech/api/v2/projects' \
            > "$WORKDIR/project.json"

          PROJECT_ID="$(jq -er '.project.id' "$WORKDIR/project.json")"
          BRANCH_ID="$(jq -er '.branch.id' "$WORKDIR/project.json")"
          DB_NAME="$(jq -er '.connection_uris[0].connection_parameters.database' "$WORKDIR/project.json")"
          DB_HOST="$(jq -er '.connection_uris[0].connection_parameters.host' "$WORKDIR/project.json")"
          OWNER_USER="$(jq -er '.connection_uris[0].connection_parameters.role' "$WORKDIR/project.json")"
          OWNER_PASS="$(jq -er '.connection_uris[0].connection_parameters.password' "$WORKDIR/project.json")"

          echo "::add-mask::$OWNER_PASS"
          COMMON_DSN="host=$DB_HOST port=5432 dbname=$DB_NAME sslmode=require"

          OWNER_READY=false
          for attempt in $(seq 1 60); do
            if PGPASSWORD="$OWNER_PASS" psql "$COMMON_DSN user=$OWNER_USER" -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null 2>&1; then
              OWNER_READY=true
              break
            fi
            sleep 2
          done
          test "$OWNER_READY" = true || { echo 'FAIL: disposable Neon database never became reachable'; exit 1; }

          PGPASSWORD="$OWNER_PASS" psql "$COMMON_DSN user=$OWNER_USER" -v ON_ERROR_STOP=1 >/dev/null <<'SQL'
          CREATE SCHEMA vault_poc;
          CREATE TABLE vault_poc.allowed_rows (
            id integer PRIMARY KEY,
            marker text NOT NULL
          );
          CREATE TABLE vault_poc.forbidden_rows (
            id integer PRIMARY KEY,
            marker text NOT NULL
          );
          REVOKE ALL ON SCHEMA vault_poc FROM PUBLIC;
          REVOKE ALL ON ALL TABLES IN SCHEMA vault_poc FROM PUBLIC;
          SQL

          curl -fsS \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H 'Content-Type: application/json' \
            --request POST \
            --data '{"type":"database"}' \
            "$VAULT_ADDR/v1/sys/mounts/database" >/dev/null

          export OWNER_USER OWNER_PASS DB_HOST DB_NAME
          python > "$WORKDIR/vault-db-config.json" <<'PY'
          import json, os
          payload = {
              "plugin_name": "postgresql-database-plugin",
              "allowed_roles": ["poc-writer"],
              "connection_url": (
                  "postgresql://{{username}}:{{password}}@"
                  + os.environ["DB_HOST"]
                  + "/"
                  + os.environ["DB_NAME"]
                  + "?sslmode=require"
              ),
              "username": os.environ["OWNER_USER"],
              "password": os.environ["OWNER_PASS"],
          }
          json.dump(payload, open('/dev/stdout', 'w'))
          PY

          curl -fsS \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H 'Content-Type: application/json' \
            --request POST \
            --data-binary "@$WORKDIR/vault-db-config.json" \
            "$VAULT_ADDR/v1/database/config/neon-poc" >/dev/null

          cat > "$WORKDIR/vault-role.json" <<'JSON'
          {
            "db_name": "neon-poc",
            "creation_statements": [
              "CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS; GRANT USAGE ON SCHEMA vault_poc TO \"{{name}}\"; GRANT INSERT, SELECT ON vault_poc.allowed_rows TO \"{{name}}\";"
            ],
            "revocation_statements": [
              "REVOKE ALL PRIVILEGES ON vault_poc.allowed_rows FROM \"{{name}}\"; REVOKE ALL PRIVILEGES ON vault_poc.forbidden_rows FROM \"{{name}}\"; REVOKE ALL PRIVILEGES ON SCHEMA vault_poc FROM \"{{name}}\"; DROP ROLE \"{{name}}\";"
            ],
            "default_ttl": "5m",
            "max_ttl": "5m"
          }
          JSON

          curl -fsS \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H 'Content-Type: application/json' \
            --request POST \
            --data-binary "@$WORKDIR/vault-role.json" \
            "$VAULT_ADDR/v1/database/roles/poc-writer" >/dev/null

          curl -fsS \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            "$VAULT_ADDR/v1/database/creds/poc-writer" \
            > "$WORKDIR/lease.json"

          LEASE_ID="$(jq -er '.lease_id' "$WORKDIR/lease.json")"
          LEASE_USER="$(jq -er '.data.username' "$WORKDIR/lease.json")"
          LEASE_PASS="$(jq -er '.data.password' "$WORKDIR/lease.json")"
          echo "::add-mask::$LEASE_USER"
          echo "::add-mask::$LEASE_PASS"

          ROLE_ATTRS="$(PGPASSWORD="$OWNER_PASS" psql "$COMMON_DSN user=$OWNER_USER" \
            -v ON_ERROR_STOP=1 -v role="$LEASE_USER" -At <<'SQL'
          SELECT concat_ws('|',
            rolsuper,
            rolcreatedb,
            rolcreaterole,
            rolinherit,
            rolreplication,
            rolbypassrls,
            rolcanlogin
          )
          FROM pg_roles
          WHERE rolname = :'role';
          SQL
          )"
          test "$ROLE_ATTRS" = 'f|f|f|f|f|f|t' || { echo 'FAIL: dynamic role attributes exceed least privilege'; exit 1; }

          NEON_SUPERUSER_MEMBER="$(PGPASSWORD="$OWNER_PASS" psql "$COMMON_DSN user=$OWNER_USER" \
            -v ON_ERROR_STOP=1 -v role="$LEASE_USER" -At <<'SQL'
          SELECT pg_has_role(:'role', 'neon_superuser', 'member');
          SQL
          )"
          test "$NEON_SUPERUSER_MEMBER" = 'f' || { echo 'FAIL: dynamic role inherited neon_superuser'; exit 1; }

          IDENTITY="$(PGPASSWORD="$LEASE_PASS" psql "$COMMON_DSN user=$LEASE_USER" \
            -v ON_ERROR_STOP=1 -Atqc "SELECT session_user || '|' || current_user")"
          test "$IDENTITY" = "$LEASE_USER|$LEASE_USER" || { echo 'FAIL: fresh PostgreSQL authentication did not use leased role'; exit 1; }

          PGPASSWORD="$LEASE_PASS" psql "$COMMON_DSN user=$LEASE_USER" -v ON_ERROR_STOP=1 >/dev/null <<'SQL'
          INSERT INTO vault_poc.allowed_rows (id, marker) VALUES (1, 'allowed');
          SQL

          set +e
          PGPASSWORD="$LEASE_PASS" psql "$COMMON_DSN user=$LEASE_USER" \
            -v ON_ERROR_STOP=1 -Atqc 'SELECT count(*) FROM vault_poc.forbidden_rows' \
            > "$WORKDIR/forbidden.out" 2> "$WORKDIR/forbidden.err"
          FORBIDDEN_RC=$?
          set -e
          test "$FORBIDDEN_RC" -ne 0 || { echo 'FAIL: forbidden relation was readable'; exit 1; }
          grep -qi 'permission denied' "$WORKDIR/forbidden.err" || { echo 'FAIL: forbidden relation failed for an unexpected reason'; exit 1; }
          if grep -Fq "$LEASE_PASS" "$WORKDIR/forbidden.err"; then
            echo 'FAIL: generated credential leaked into PostgreSQL error output'
            exit 1
          fi

          set +e
          PGPASSWORD="$LEASE_PASS" psql "$COMMON_DSN user=$LEASE_USER" \
            -v ON_ERROR_STOP=1 > "$WORKDIR/txn.out" 2> "$WORKDIR/txn.err" <<'SQL'
          BEGIN;
          INSERT INTO vault_poc.allowed_rows (id, marker) VALUES (77, 'rollback');
          SELECT 1 / 0;
          COMMIT;
          SQL
          TXN_RC=$?
          set -e
          test "$TXN_RC" -ne 0 || { echo 'FAIL: deliberate transaction failure did not fail'; exit 1; }
          if grep -Fq "$LEASE_PASS" "$WORKDIR/txn.err"; then
            echo 'FAIL: generated credential leaked into transaction error output'
            exit 1
          fi
          ROLLBACK_COUNT="$(PGPASSWORD="$OWNER_PASS" psql "$COMMON_DSN user=$OWNER_USER" \
            -v ON_ERROR_STOP=1 -Atqc 'SELECT count(*) FROM vault_poc.allowed_rows WHERE id = 77')"
          test "$ROLLBACK_COUNT" = '0' || { echo 'FAIL: transaction rollback left a surviving row'; exit 1; }

          python - "$LEASE_ID" > "$WORKDIR/revoke.json" <<'PY'
          import json, sys
          json.dump({"lease_id": sys.argv[1]}, sys.stdout)
          PY
          curl -fsS \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H 'Content-Type: application/json' \
            --request PUT \
            --data-binary "@$WORKDIR/revoke.json" \
            "$VAULT_ADDR/v1/sys/leases/revoke" >/dev/null
          LEASE_ID=''

          ROLE_GONE=false
          for attempt in $(seq 1 20); do
            ROLE_COUNT="$(PGPASSWORD="$OWNER_PASS" psql "$COMMON_DSN user=$OWNER_USER" \
              -v ON_ERROR_STOP=1 -v role="$LEASE_USER" -At <<'SQL'
          SELECT count(*) FROM pg_roles WHERE rolname = :'role';
          SQL
          )"
            if [[ "$ROLE_COUNT" = '0' ]]; then
              ROLE_GONE=true
              break
            fi
            sleep 1
          done
          test "$ROLE_GONE" = true || { echo 'FAIL: Vault revocation did not remove dynamic role'; exit 1; }

          set +e
          PGPASSWORD="$LEASE_PASS" psql "$COMMON_DSN user=$LEASE_USER" \
            -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' \
            > "$WORKDIR/post-revoke.out" 2> "$WORKDIR/post-revoke.err"
          POST_REVOKE_RC=$?
          set -e
          test "$POST_REVOKE_RC" -ne 0 || { echo 'FAIL: revoked credential still authenticated on a fresh connection'; exit 1; }
          if grep -Fq "$LEASE_PASS" "$WORKDIR/post-revoke.err"; then
            echo 'FAIL: revoked credential leaked into authentication error output'
            exit 1
          fi

          FORBIDDEN_COUNT="$(PGPASSWORD="$OWNER_PASS" psql "$COMMON_DSN user=$OWNER_USER" \
            -v ON_ERROR_STOP=1 -Atqc 'SELECT count(*) FROM vault_poc.forbidden_rows')"
          test "$FORBIDDEN_COUNT" = '0' || { echo 'FAIL: forbidden table contains unexpected rows'; exit 1; }

          PGPASSWORD="$OWNER_PASS" psql "$COMMON_DSN user=$OWNER_USER" \
            -v ON_ERROR_STOP=1 -qc 'DROP SCHEMA vault_poc CASCADE' >/dev/null

          curl -fsS \
            -H "Authorization: Bearer $NEON_API_KEY" \
            --request DELETE \
            "https://console.neon.tech/api/v2/projects/$PROJECT_ID" >/dev/null

          DELETED=false
          for attempt in $(seq 1 30); do
            HTTP_CODE="$(curl -sS -o "$WORKDIR/project-get.json" -w '%{http_code}' \
              -H "Authorization: Bearer $NEON_API_KEY" \
              "https://console.neon.tech/api/v2/projects/$PROJECT_ID")"
            if [[ "$HTTP_CODE" = '404' ]]; then
              DELETED=true
              break
            fi
            sleep 1
          done
          test "$DELETED" = true || { echo 'FAIL: disposable Neon project deletion was not confirmed'; exit 1; }
          PROJECT_ID=''

          docker rm -f vault-neon-poc >/dev/null
          rm -rf "$WORKDIR"
          trap - EXIT

          echo 'POC_RESULT=PASS'
          echo 'VAULT_COMMUNITY_VERSION=1.21.4'
          echo 'DYNAMIC_ROLE_LEAST_PRIVILEGE=PASS'
          echo 'NEON_SUPERUSER_MEMBERSHIP=ABSENT'
          echo 'FRESH_POSTGRES_AUTH=PASS'
          echo 'ALLOWED_OPERATION=PASS'
          echo 'FORBIDDEN_OPERATION=DENIED'
          echo 'TRANSACTION_ROLLBACK=PASS'
          echo 'LEASE_REVOCATION=PASS'
          echo 'FRESH_AUTH_AFTER_REVOCATION=DENIED'
          echo 'DISPOSABLE_NEON_PROJECT_DELETE=CONFIRMED'
