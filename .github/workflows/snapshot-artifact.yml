name: Snapshot Artifact Helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate hosted tool snapshots
        run: pnpm exec vitest run mcp/__tests__/hosted-tools-list.snapshot.test.ts -u
      - name: Upload exact generated snapshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: role-selector-generated-snapshots
          path: |
            mcp/__tests__/__snapshots__/hosted-tools-list.json
            mcp/__tests__/__snapshots__/hosted-tools-catalog.md
          if-no-files-found: error
