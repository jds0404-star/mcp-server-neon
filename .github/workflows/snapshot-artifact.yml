name: Snapshot Artifact Helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  snapshots:
    if: >-
      github.repository == 'jds0404-star/mcp-server-neon' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/run-sql-role-targeting'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/run-sql-role-targeting
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate hosted tool snapshots
        run: pnpm exec vitest run mcp/__tests__/hosted-tools-list.snapshot.test.ts -u
      - name: Verify bounded generated diff
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in
              mcp/__tests__/__snapshots__/hosted-tools-list.json|mcp/__tests__/__snapshots__/hosted-tools-catalog.md)
                ;;
              *)
                echo "::error::Unexpected generated change: $path"
                exit 1
                ;;
            esac
          done < <(git diff --name-only)
      - name: Upload exact generated snapshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: role-selector-generated-snapshots
          path: |
            mcp/__tests__/__snapshots__/hosted-tools-list.json
            mcp/__tests__/__snapshots__/hosted-tools-catalog.md
          if-no-files-found: error
      - name: Commit exact generated snapshots
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            mcp/__tests__/__snapshots__/hosted-tools-list.json \
            mcp/__tests__/__snapshots__/hosted-tools-catalog.md
          if git diff --cached --quiet; then
            echo "Generated snapshots already match; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: refresh generated SQL selector snapshots"
          git push origin HEAD:feat/run-sql-role-targeting
